[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dq-copilot"
version = "0.1.0"
description = "LLM-assisted data quality agent: profile data, propose validation rules, run checks, explain failures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bryan Lusse" }]
dependencies = [
    "duckdb>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "tenacity>=8.2",          # retries around LLM calls
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "pandas>=3.1.0",
]

[project.optional-dependencies]
# LLM providers
claude = ["anthropic>=0.40"]
ollama = ["ollama>=0.3"]
# interfaces
mcp = ["mcp>=1.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "prometheus-client>=0.20"]
# monitoring / evals
monitoring = ["opentelemetry-exporter-otlp>=1.25", "langfuse>=2.0"]
evals = ["pandas>=2.2", "pyarrow>=15.0", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[project.scripts]
datasleuth = "datasleuth.interfaces.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["dq_copilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=datasleuth --cov-report=term-missing"
markers = [
    "llm: calls a real LLM (skipped in CI, run manually or in the evals workflow)",
]
